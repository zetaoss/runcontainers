name: pull-request
on:
  pull_request:
    types: [opened, reopened, synchronize]

permissions:
  contents: read
  packages: read

env:
  DEBIAN_TAG: 12.8-slim
  NOTEBOOK_TAG: 2024-12-09

jobs:
  plan:
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
    - uses: actions/checkout@v4
    - uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    - id: plan
      run: echo "matrix=$(.github/plan.sh)" >> "$GITHUB_OUTPUT"

  # Builds what merging would push: tags.yaml entries whose tag is not in the registry yet.
  docker-build:
    needs: plan
    if: needs.plan.outputs.matrix != '[]'
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
    - uses: actions/checkout@v4

    - name: Extract metadata (tags, labels) for Docker
      id: meta
      uses: docker/metadata-action@v5

    - name: Build
      uses: docker/build-push-action@v6
      with:
        context: .
        file: img/Dockerfile.${{ matrix.lang }}
        push: false
        tags: ghcr.io/zetaoss/runcontainers/${{ matrix.lang }}:${{ matrix.tag }}
        labels: ${{ steps.meta.outputs.labels }}
        build-args: |
          DEBIAN_TAG=${{ env.DEBIAN_TAG }}
          NOTEBOOK_TAG=${{ env.NOTEBOOK_TAG }}
