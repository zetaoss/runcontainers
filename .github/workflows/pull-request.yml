name: pull-request
on:
  pull_request:

permissions:
  contents: read

jobs:
  plan:
    runs-on: ubuntu-24.04
    outputs:
      langs: ${{ steps.plan.outputs.langs }}
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
    - id: plan
      env:
        BASE: origin/${{ github.base_ref }}
      run: |
        if ! git diff --quiet "$BASE"...HEAD -- VERSION; then
          version=$(cat VERSION)
          latest=$(git tag -l 'v*' --sort=-v:refname | head -1)
          [[ "$version" =~ ^0\.[0-9]+\.[0-9]+$ ]] || { echo "error: VERSION $version is not 0.x.y" >&2; exit 1; }
          [[ "$(printf '%s\n' "${latest#v}" "$version" | sort -V | tail -1)" == "$version" && "v$version" != "$latest" ]] \
            || { echo "error: VERSION $version is not after $latest" >&2; exit 1; }
        fi
        # A change to CI builds and tests every image.
        if git diff --quiet "$BASE"...HEAD -- .github; then all=; else all=1; fi
        echo "langs=$(ALL=$all .github/plan.sh)" >> "$GITHUB_OUTPUT"

  build:
    needs: plan
    if: needs.plan.outputs.langs != '[]'
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        lang: ${{ fromJSON(needs.plan.outputs.langs) }}
    steps:
    - uses: actions/checkout@v4

    - name: Build
      uses: docker/build-push-action@v6
      with:
        context: .
        file: img/Dockerfile.${{ matrix.lang }}
        load: true
        tags: runcontainers/${{ matrix.lang }}:test

    - name: Test
      if: hashFiles(format('tests/Dockerfile.{0}', matrix.lang)) != ''
      run: docker build -f tests/Dockerfile.${{ matrix.lang }} --build-arg IMAGE=runcontainers/${{ matrix.lang }}:test tests
