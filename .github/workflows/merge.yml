name: merge
on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  plan:
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
    - uses: actions/checkout@v4
    - uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    - id: plan
      run: |
        matrix=$(.github/plan.sh)
        echo "matrix=$matrix" >> "$GITHUB_OUTPUT"

  docker-push:
    needs: plan
    if: needs.plan.outputs.matrix != '[]'
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
    - uses: actions/checkout@v4

    - name: Login to GitHub Container Registry
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Extract metadata (tags, labels) for Docker
      id: meta
      uses: docker/metadata-action@v5

    - name: Build
      uses: docker/build-push-action@v6
      with:
        context: .
        file: img/Dockerfile.${{ matrix.lang }}
        load: true
        tags: |
          ghcr.io/zetaoss/runcontainers/${{ matrix.lang }}:${{ matrix.tag }}
          ghcr.io/zetaoss/runcontainers/${{ matrix.lang }}:latest
          ${{ matrix.lang == 'latex' && format('ghcr.io/zetaoss/runcontainers/tex:{0}', matrix.tag) || '' }}
          ${{ matrix.lang == 'latex' && 'ghcr.io/zetaoss/runcontainers/tex:latest' || '' }}
        labels: ${{ steps.meta.outputs.labels }}

    - name: Test
      if: hashFiles(format('tests/Dockerfile.{0}', matrix.lang)) != ''
      run: docker build -f tests/Dockerfile.${{ matrix.lang }} --build-arg IMAGE=ghcr.io/zetaoss/runcontainers/${{ matrix.lang }}:${{ matrix.tag }} tests

    - name: Push
      run: |
        docker push --all-tags ghcr.io/zetaoss/runcontainers/${{ matrix.lang }}
        if [[ ${{ matrix.lang }} == latex ]]; then docker push --all-tags ghcr.io/zetaoss/runcontainers/tex; fi

    - uses: actions/delete-package-versions@v5
      with:
        package-name: runcontainers/${{ matrix.lang }}
        package-type: 'container'
        delete-only-untagged-versions: 'true'
