name: release
# A merge that changes VERSION releases v<VERSION>. "[rebuild]" in the commit message (the PR title) rebuilds
# every image, e.g. for security updates. Rerun failed jobs to retry a release.
on:
  push:
    branches: [main]
    paths: [VERSION]

permissions:
  contents: read

env:
  REGISTRY: ghcr.io/zetaoss/runcontainers

jobs:
  plan:
    runs-on: ubuntu-24.04
    outputs:
      langs: ${{ steps.plan.outputs.langs }}
      tag: ${{ steps.plan.outputs.tag }}
      prev: ${{ steps.plan.outputs.prev }}
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
    - uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    - id: plan
      env:
        MESSAGE: ${{ github.event.head_commit.message }}
      run: |
        tag=v$(cat VERSION)
        prev=$(git describe --tags --abbrev=0 --match 'v*' --exclude "$tag" HEAD 2>/dev/null || true)
        echo "tag=$tag" >> "$GITHUB_OUTPUT"
        echo "prev=$prev" >> "$GITHUB_OUTPUT"
        # Images changed since the previous release; every image with [rebuild] or without a previous release.
        all=; [[ "$MESSAGE" != *"[rebuild]"* && -n "$prev" ]] || all=1
        echo "langs=$(BASE=$prev PREV=$prev ALL=$all .github/plan.sh)" >> "$GITHUB_OUTPUT"

  build:
    needs: plan
    if: needs.plan.outputs.langs != '[]'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    env:
      TAG: ${{ needs.plan.outputs.tag }}
    strategy:
      fail-fast: false
      matrix:
        lang: ${{ fromJSON(needs.plan.outputs.langs) }}
    steps:
    - uses: actions/checkout@v4

    - uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - id: meta
      uses: docker/metadata-action@v5
      with:
        images: ${{ env.REGISTRY }}/${{ matrix.lang }}
        tags: |
          type=raw,value=${{ env.TAG }}
          type=raw,value=latest

    - name: Build
      uses: docker/build-push-action@v6
      with:
        context: .
        file: img/Dockerfile.${{ matrix.lang }}
        load: true
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}

    - name: Test
      if: hashFiles(format('tests/Dockerfile.{0}', matrix.lang)) != ''
      run: docker build -f tests/Dockerfile.${{ matrix.lang }} --build-arg IMAGE=$REGISTRY/${{ matrix.lang }}:$TAG tests

    - uses: imjasonh/setup-crane@v0.7

    - name: Push
      id: push
      env:
        LANG_: ${{ matrix.lang }}
      run: |
        image=$REGISTRY/$LANG_
        docker push --all-tags "$image"
        digest=$(docker inspect --format '{{index .RepoDigests 0}}' "$image:$TAG" | cut -d@ -f2)
        if [[ $LANG_ == latex ]]; then
          crane copy "$image@$digest" "$REGISTRY/tex:$TAG"
          crane tag "$REGISTRY/tex:$TAG" latest
        fi
        echo "digest=$digest" >> "$GITHUB_OUTPUT"

    - uses: actions/attest-build-provenance@v2
      with:
        subject-name: ${{ env.REGISTRY }}/${{ matrix.lang }}
        subject-digest: ${{ steps.push.outputs.digest }}

    - uses: actions/delete-package-versions@v5
      with:
        package-name: runcontainers/${{ matrix.lang }}
        package-type: container
        delete-only-untagged-versions: 'true'

  # Tags the images not built with this version from the previous release (same digest), then creates the release.
  release:
    needs: [plan, build]
    if: ${{ !failure() && !cancelled() }}
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      packages: write
    env:
      TAG: ${{ needs.plan.outputs.tag }}
      PREV: ${{ needs.plan.outputs.prev }}
      LANGS: ${{ needs.plan.outputs.langs }}
    steps:
    - uses: actions/checkout@v4

    - uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - uses: imjasonh/setup-crane@v0.7

    # crane tag puts the same manifest under the new tag (same digest); imagetools create would wrap it in an index.
    - name: Tag unchanged images
      run: |
        for f in img/Dockerfile.*; do
          lang=${f#img/Dockerfile.}
          jq -e --arg l "$lang" 'index($l)' <<<"$LANGS" >/dev/null && continue
          echo "tag $lang:$PREV -> $TAG"
          crane tag "$REGISTRY/$lang:$PREV" "$TAG"
          if [[ $lang == latex ]]; then crane tag "$REGISTRY/tex:$PREV" "$TAG"; fi
        done

    - name: Create release
      env:
        GH_TOKEN: ${{ github.token }}
      run: gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --target "$GITHUB_SHA" --generate-notes
