# Image release (dates in UTC).
# images: the published tag of each image. On merge, CI makes the registry match it:
#   - an image whose tag is releaseDate and is not in the registry yet is built and pushed as <tag> and latest
#   - an image with an earlier tag that is not in the registry yet gets it on its current latest,
#     only if latest was created that day
# Existing tags are never rebuilt. latex is also pushed as tex.
releaseDate: 2026-10-09
images:
  bash: 2026-01-06
  c: 2026-01-06
  cpp: 2026-01-06
  csharp: 2026-01-06
  go: 2026-10-09
  java: 2026-01-06
  kotlin: 2026-01-06
  latex: 2026-01-06
  lua: 2026-01-06
  mysql: 2026-01-06
  perl: 2026-01-06
  php: 2026-10-09
  powershell: 2026-01-06
  python: 2026-01-06
  python-notebook: 2025-06-29
  r: 2026-01-06
  r-notebook: 2025-06-29
  ruby: 2026-01-06
  sqlite3: 2026-01-06
  swift: 2026-01-06
